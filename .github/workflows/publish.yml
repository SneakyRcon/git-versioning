name: Publish Gradle plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out plugin source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Plugin tag must be vX.Y.Z; got $GITHUB_REF_NAME." >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to Gradle Plugin Portal
        shell: bash
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PUBLISH_KEY" || { echo 'GRADLE_PUBLISH_KEY is not configured.' >&2; exit 1; }
          test -n "$GRADLE_PUBLISH_SECRET" || { echo 'GRADLE_PUBLISH_SECRET is not configured.' >&2; exit 1; }
          ./gradlew -PreleaseVersion="${{ steps.release.outputs.version }}" publishPlugins
